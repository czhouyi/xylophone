<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>曲谱详情 · 木琴曲谱库</title>
  <meta name="description" content="木琴简谱曲谱详情：在线查看简谱并试听。">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/score.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">木琴曲谱库</a>
      <p class="brand-sub">简谱 · 在线试听</p>
    </div>
  </header>

  <main class="wrap">
    <a class="back-link" href="index.html">← 返回曲谱列表</a>

    <p id="page-status" class="status-line" role="status">正在加载曲谱…</p>

    <article id="score-article" hidden>
      <header class="score-header">
        <h1 id="score-title" class="score-title"></h1>
        <p id="score-subtitle" class="score-subtitle"></p>
        <p id="score-byline" class="score-byline"></p>
        <div id="score-tags" class="score-tags"></div>
      </header>

      <!-- 全屏舞台：正常页面里只是普通容器，进入全屏后铺满视口 -->
      <div id="score-stage" class="score-stage">
        <div id="fs-bar" class="fs-bar">
          <p id="fs-title" class="fs-title"></p>
          <div class="fs-actions">
            <button id="fs-play" type="button" disabled>▶ 播放</button>
            <button id="fs-pause" type="button" class="secondary" disabled>⏸ 暂停</button>
            <button id="fs-stop" type="button" class="secondary" disabled>⏹ 停止</button>
            <button id="fs-share" type="button" class="secondary">分享</button>
            <button id="fs-exit" type="button" class="secondary">✕ 退出全屏</button>
          </div>
        </div>

        <!-- 简谱渲染容器（notation.js 会在这里生成 SVG） -->
        <div id="notation-container" class="notation-card nt-score"></div>

        <!-- 分享图预览；放在 stage 内部，原生全屏时也能显示 -->
        <div id="share-modal" class="share-modal" role="dialog" aria-modal="true"
             aria-labelledby="share-heading" hidden>
          <div class="share-sheet">
            <div class="share-head">
              <h2 id="share-heading">分享曲谱</h2>
              <button id="share-close" type="button" class="secondary" aria-label="关闭分享图">✕</button>
            </div>
            <div class="share-preview">
              <p id="share-status" class="status-line" role="status">正在生成图片…</p>
              <img id="share-image" alt="曲谱分享图" hidden>
            </div>
            <div class="share-actions">
              <button id="share-native" type="button" class="secondary" hidden>系统分享</button>
              <button id="share-download" type="button" hidden>下载图片</button>
            </div>
          </div>
        </div>
      </div>

      <div class="toolbar">
        <div class="field">
          <label for="instrument">音色</label>
          <!-- value 为 abcjs 的 %%MIDI program 编号（0-based GM），务必与乐器名对应 -->
          <select id="instrument">
            <option value="13" selected>木琴 (Xylophone)</option>
            <option value="12">马林巴 (Marimba)</option>
            <option value="11">颤音琴 (Vibraphone)</option>
            <option value="9">钟琴 (Glockenspiel)</option>
            <option value="8">钢片琴 (Celesta)</option>
            <option value="0">钢琴 (Piano)</option>
          </select>
        </div>

        <div class="field">
          <label for="tempo">速度</label>
          <!-- 速度不写在谱面里，在这里调；单位是每分钟四分音符数 -->
          <input id="tempo" type="range" min="40" max="208" step="2" value="120">
          <output id="tempo-value" for="tempo" class="tempo-value">120 BPM</output>
        </div>

        <div class="controls">
          <button id="btn-play" type="button" disabled>▶ 播放</button>
          <button id="btn-pause" type="button" class="secondary" disabled>⏸ 暂停</button>
          <button id="btn-stop" type="button" class="secondary" disabled>⏹ 停止</button>
          <button id="btn-fullscreen" type="button" class="secondary" aria-pressed="false">⛶ 全屏看谱</button>
        </div>
      </div>

      <p id="play-status" class="status-line" role="status"></p>

      <section class="editor">
        <button id="btn-edit" type="button" class="secondary" aria-expanded="false" aria-controls="editor-panel">✎ 临时改谱</button>

        <div id="editor-panel" class="editor-panel" hidden>
          <div class="editor-head">
            <p class="editor-hint">改动只在这个页面里生效，<strong>刷新就回到原来的曲谱</strong>；改完直接按「播放」试听。</p>
            <button id="btn-revert" type="button" class="secondary">恢复原谱</button>
          </div>
          <textarea id="notation-input" spellcheck="false" rows="14" aria-label="简谱内容"></textarea>
          <p id="editor-status" class="status-line" role="status"></p>
        </div>
      </section>
    </article>
  </main>

  <footer class="site-footer">
    <div class="wrap">木琴曲谱库 · 简谱渲染自研 · 音频合成 abcjs</div>
  </footer>

  <!-- abcjs（音频合成，提供全局 ABCJS） -->
  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.3.0/dist/abcjs-basic-min.js"></script>
  <!-- 页面入口（ES module） -->
  <script type="module" src="assets/js/score.js"></script>
</body>
</html>
